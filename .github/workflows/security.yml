name: Security

# Scans code on every push to main/dev and on every PR targeting them, plus a
# weekly baseline. Delegates to the shared reusable workflows in cfdude/.github so
# scanning stays consistent across repos and is maintained in one place.
#
# PINNED REFS: the `uses:` lines below name a commit SHA in cfdude/.github, not
# @main. Unpinned, anything landing on that repo's main would execute here
# immediately with security-events: write — no review step. The reusable
# workflows already SHA-pin their own third-party actions (actions/checkout,
# codeql-action), so leaving the wrapper floating was the weaker link.
#
# TO BUMP after changing the shared workflows:
#   gh api repos/cfdude/.github/commits/main -q .sha
# then replace the SHA on both `uses:` lines and update the trailing date
# comment. Keep cfdude-plugins and cfdude/claude-honcho on the SAME pin.

on:
  push:
    branches: [main]        # post-merge baseline on the protected branch
  pull_request:
    branches: [main, dev]   # gate every PR (this is where scans block merges)
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC — catch newly-disclosed CVEs

# One scan per ref; cancel superseded runs so PR updates don't pile up or collide
# on SARIF upload.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST
    uses: cfdude/.github/.github/workflows/security-semgrep.yml@b5f9e50d643459b3d89c0cd5fdb53119ed4f4746  # cfdude/.github main as of 2026-08-07
    permissions:
      contents: read
      security-events: write

  trivy:
    name: Trivy FS scan
    uses: cfdude/.github/.github/workflows/security-trivy.yml@b5f9e50d643459b3d89c0cd5fdb53119ed4f4746  # cfdude/.github main as of 2026-08-07
    permissions:
      contents: read
      security-events: write
